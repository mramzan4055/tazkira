  renderVals() {
    return { course: {

      who: "For children learning the foundations, and for anyone who knows the five pillars by name but not by meaning.",
      ages: "6+ and adults", level: "Beginner", session: "30 minutes, one-to-one",
      duration: "2–3 months", prerequisite: "None",
      outcomes: [
        "Name and explain each of the five pillars in your own words.",
        "Understand the purpose behind each one, not only the requirement.",
        "Perform the ones that apply to you now, correctly.",
        "Explain them to someone else — which for children is often the moment it becomes real.",
      ],
      structureHeading: "One pillar at a time",
      structure: [
        { h: "Shahadah", b: "What is being declared and what it commits you to." },
        { h: "Salah", b: "The five daily prayers, how and why." },
        { h: "Zakat", b: "Who pays, how much, and the reasoning behind it." },
        { h: "Sawm", b: "Fasting in Ramadan, including who is exempt and why." },
        { h: "Hajj", b: "The pilgrimage, its rites and their meanings." },
      ],
      startingPointHeading: "Is this the right starting point?",
      spYes: [
        "Your child can list the pillars but cannot explain any of them.",
        "You are new to Islam and want the foundations first.",
        "You want a short, complete course rather than an open-ended programme.",
      ],
      spNoLabel: "Consider also:",
      spNo: [
        "Basic Islamic Course — for the practical detail of worship.",
        "Islamic Studies for Kids & Adults — to continue further.",
      ],
      notSure: null,
      faqs: [
        { q: "What are the five pillars of Islam?", a: "The Shahadah (declaration of faith), Salah (five daily prayers), Zakat (obligatory charity), Sawm (fasting in Ramadan) and Hajj (pilgrimage to Makkah for those able)." },
        { q: "What age is this for?", a: "From around six upward, and it works equally well for adults new to Islam." },
        { q: "How many sessions is it?", a: "Commonly two to three months at two classes a week. It is deliberately short and complete." },
        { q: "Is this included in other courses?", a: "The pillars are covered within Islamic Studies as part of a broader programme. This course treats them on their own, in more depth, and finishes." },
      ],
      related: [
        { name: "Basic Islamic Course", slug: "basic-islamic-studies", desc: "the practical detail." },
        { name: "Daily Duas & Supplications", slug: "daily-duas", desc: "short and complementary." },
        { name: "Islamic Studies for New Muslims", slug: "new-muslims", desc: "if you are starting from the beginning." },
      ],
      finalCtaHeading: "Start with a free class",
      finalCtaBody: "Thirty minutes, one-to-one, with the teacher of your choice. No card details and no obligation.",
