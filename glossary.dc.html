<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/tazkirah-design-system-bcbab7c6-6e80-4073-a41d-d66b93b5f566/styles.css">
  <script src="_ds/tazkirah-design-system-bcbab7c6-6e80-4073-a41d-d66b93b5f566/_ds_bundle.js" defer></script>
  <style>a{color:var(--teal-700)} a:hover{color:var(--teal-900)}</style>
</helmet>
<div style="background:var(--surface-page);font-family:var(--font-sans)">
  <dc-import name="NavBar" hint-size="100%,110px"></dc-import>
  <div style="padding:64px 0 16px"><div style="max-width:var(--container-max);margin:0 auto;padding:0 24px">
    <div style="font:var(--text-h1);color:var(--teal-900);margin-bottom:16px">Quran Learning Terms Explained</div>
    <div style="font:var(--text-body-lg);color:var(--text-secondary);max-width:680px">Fifteen terms parents and new students meet often and rarely have explained. Each definition links to the course where the concept is actually taught.</div>
  </div></div>

  <div style="padding:16px 0"><div style="max-width:var(--container-max);margin:0 auto;padding:0 24px">
    <div style="display:flex;flex-wrap:wrap;gap:10px;padding:16px 0 32px;border-bottom:1px solid var(--border-subtle)">
      <sc-for list="{{ terms }}" as="t" hint-placeholder-count="15">
        <a href="{{ t.hashHref }}" style="font:600 13px var(--font-sans);color:var(--teal-700);background:var(--cream-100);padding:7px 14px;border-radius:var(--radius-pill);text-decoration:none">{{ t.name }}</a>
      </sc-for>
    </div>
  </div></div>

  <div style="padding:16px 0 56px"><div style="max-width:760px;margin:0 auto;padding:0 24px">
    <sc-for list="{{ terms }}" as="t" hint-placeholder-count="15">
      <div id="{{ t.id }}" style="padding:28px 0;border-bottom:1px solid var(--border-subtle)">
        <div style="font:var(--text-h3);color:var(--teal-900);margin-bottom:8px">{{ t.name }}</div>
        <div style="font:600 15px var(--font-sans);color:var(--text-primary);margin-bottom:8px">{{ t.summary }}</div>
        <div style="font:var(--text-body);color:var(--text-secondary);line-height:1.6;margin-bottom:14px">{{ t.body }}</div>
        <a href="{{ t.relatedHref }}" style="font:600 14px var(--font-sans);color:var(--teal-700);text-decoration:none">Related: {{ t.relatedLabel }} →</a>
      </div>
    </sc-for>
  </div></div>

  <div style="padding:0 0 56px"><div style="max-width:var(--container-max);margin:0 auto;padding:0 24px">
    <x-import component-from-global-scope="TazkirahDesignSystem_bcbab7.CtaBlock" heading="See these terms in a real class" body="Reading a definition and hearing it applied are different things. A free class shows you both." microcopy="No card needed. No obligation. We will never charge you for a trial class." hint-size="100%,320px"></x-import>
  </div></div>

  <dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const terms = [
      { id: "qaida", name: "Qaida (Noorani Qaida)", summary: "The standard beginner's primer for reading Quranic Arabic.", body: "Noorani Qaida teaches the Arabic letters, their correct pronunciation, vowel marks, and how letters join into words. It is normally the first step before reading from the Mushaf, and typically takes several months depending on age and frequency.", relatedLabel: "Basic Qaida Course", relatedHref: "course-basic-qaida.html" },
      { id: "tajweed", name: "Tajweed", summary: "The set of rules governing correct Quranic pronunciation.", body: "Tajweed covers how each letter is articulated, when sounds are elongated, merged or held. Applying Tajweed preserves the meaning of the text, since Arabic pronunciation changes meaning. It is normally learned after basic reading fluency is established.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
      { id: "hifz", name: "Hifz", summary: "The memorisation of the Quran.", body: "Hifz refers to committing the Quran to memory, usually over several years of daily study and revision. A person who has completed Hifz is called a Hafiz (male) or Hafizah (female).", relatedLabel: "Hifz Programme", relatedHref: "course-hifz.html" },
      { id: "hafiz", name: "Hafiz / Hafizah", summary: "A person who has memorised the entire Quran.", body: "Hafiz (male) and Hafizah (female) describe someone who has completed Hifz — full memorisation of the Quran — and can recite it without reading from the text.", relatedLabel: "Hifz Programme", relatedHref: "course-hifz.html" },
      { id: "ijazah", name: "Ijazah", summary: "A certification of authorisation to teach or transmit Quranic recitation.", body: "An Ijazah indicates a verified chain of transmission for recitation, granted by a qualified teacher once a student has demonstrated mastery. It is one of the clearest indicators of a teacher's verified qualification.", relatedLabel: "Our Teachers", relatedHref: "teachers.html" },
      { id: "sanad", name: "Sanad", summary: "The chain of transmission linking a reciter back to the Prophet ﷺ.", body: "A Sanad documents the unbroken line of teachers through which a particular recitation has been transmitted, generation to generation. It underpins the authority of an Ijazah.", relatedLabel: "Our Teachers", relatedHref: "teachers.html" },
      { id: "tarteel", name: "Tarteel", summary: "Measured, unhurried Quranic recitation.", body: "Tarteel describes reciting at a steady, clear pace with correct rhythm, rather than rushing through the text. It is distinct from Tajweed, which governs pronunciation rules rather than pace.", relatedLabel: "Quran Recitation", relatedHref: "course-quran-recitation.html" },
      { id: "muraja-ah", name: "Muraja'ah", summary: "The structured revision of previously memorised or learned material.", body: "Muraja'ah is the practice of regularly reciting material already covered, to prevent it being forgotten. In Hifz specifically, the quality of a programme's Muraja'ah system matters more than how quickly new material is added.", relatedLabel: "Hifz Programme", relatedHref: "course-hifz.html" },
      { id: "makharij", name: "Makharij", summary: "The precise points in the mouth and throat where each Arabic letter is articulated.", body: "Makharij (singular: Makhraj) is the foundation of Tajweed — most persistent pronunciation errors trace back to a letter being formed in the wrong place. It is typically the first thing taught in a structured Tajweed course.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
      { id: "qalqalah", name: "Qalqalah", summary: "A distinctive echoing or bouncing sound applied to five specific Arabic letters.", body: "Qalqalah applies to the letters Qaf, Ta, Ba, Jeem and Dal when they carry a Sukoon (no vowel), producing a brief bounce in pronunciation. It is one of the later-stage rules taught in a Tajweed course.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
      { id: "madd", name: "Madd", summary: "The elongation of certain vowel sounds during recitation.", body: "Madd rules specify which sounds are held for an extended count and by how much, based on the letters and marks involved. Applying Madd incorrectly is one of the most common recitation errors.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
      { id: "noon-saakin", name: "Noon Saakin and Tanween", summary: "A set of four Tajweed rules governing an unvowelled Noon or a doubled-vowel mark.", body: "Noon Saakin and Tanween together govern one of the most frequent sounds in the Quran, through four rules: Izhaar, Idghaam, Iqlaab and Ikhfa. Each determines how the sound is pronounced depending on the letter that follows it.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
      { id: "qira-at", name: "Qira'at", summary: "The recognised, authenticated variant readings of the Quran.", body: "Qira'at refers to the different validated ways the Quran may be recited, each transmitted through its own Sanad. Most teaching, including at Tazkirah, follows the most widely-read of these.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
      { id: "mushaf", name: "Mushaf", summary: "A physical or printed copy of the Quran.", body: "The Mushaf is the written text of the Quran as compiled and standardised. Students typically move from a Qaida primer to reading directly from the Mushaf once basic letter recognition is secure.", relatedLabel: "Quran Recitation", relatedHref: "course-quran-recitation.html" },
      { id: "waqf", name: "Waqf", summary: "The Tajweed rules governing where a reciter may or must pause.", body: "Waqf rules identify where stopping is permitted, preferred, or should be avoided within a verse, since stopping in the wrong place can change the apparent meaning of the text. It is typically one of the later stages of a Tajweed course.", relatedLabel: "Tajweed Ul Quran", relatedHref: "course-tajweed.html" },
    ];
    return { terms: terms.map(t => ({ ...t, hashHref: '#' + t.id })) };
  }
}
