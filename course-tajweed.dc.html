      h1: "Online Tajweed Classes — Learn to Recite the Quran Correctly",
      name: "Tajweed Ul Quran",
      who: "For children from around age eight and adults who can already read, but read with mistakes — the ones a group class never had time to catch.",
      ages: "8+ and adults", level: "Can read Arabic script, with or without fluency", session: "30 minutes, one-to-one",
      duration: "6–18 months to work through the rules, then ongoing refinement", prerequisite: "Able to read Arabic letters and short words",
      outcomes: [
        "Pronounce every letter from its correct articulation point — the Makharij.",
        "Apply the rules of Noon Saakin and Tanween, Meem Saakin, Madd and Qalqalah without stopping to think about them.",
        "Know where to stop and where not to — the rules of Waqf that change meaning when ignored.",
        "Recite at a measured pace with correct rhythm rather than rushing to the end of the verse.",
        "And the one that matters most: hear your own mistakes without being told.",
      ],
      outcomesClosing: "That final point is the real outcome. A student who can self-correct keeps improving after the course ends. A student who only corrects when a teacher intervenes stops the day the classes do.",
      structureHeading: "How the course is structured",
      structure: [
        { h: "Level 1 · Makharij — the articulation points", b: "Where each letter is actually formed in the mouth and throat. Most persistent errors trace back to this level, which is why it comes first even for students who think they have moved past it." },
        { h: "Level 2 · Noon Saakin and Tanween", b: "Izhaar, Idghaam, Iqlaab and Ikhfa — the four rules that govern the most frequent sound in the Quran." },
        { h: "Level 3 · Meem Saakin and Madd", b: "The rules of the silent Meem, then elongation — which sounds are held, and for how long." },
        { h: "Level 4 · Qalqalah, Waqf and fluency", b: "The bouncing letters, the rules of stopping and starting, and putting the whole system together at reading pace." },
      ],
      startingPointHeading: "Is Tajweed the right starting point for you?",
      spYes: [
        "Your child can read from the Mushaf but you can hear that something is not right and cannot pinpoint it.",
        "Your child learned to read at a group madrasah where nobody had time to correct individual pronunciation.",
        "You are an adult who reads fluently but never learned the rules formally.",
        "Your child is preparing for Hifz. Memorising with incorrect pronunciation embeds the error permanently — Tajweed first is always the cheaper path.",
      ],
      spNoLabel: "Probably not yet, if:",
      spNo: [
        "Your child cannot yet read joined words. Start with Basic Qaida.",
        "Your child reads very slowly, stopping to work out each word. Build fluency with Quran Recitation first, then come back.",
      ],
      notSure: "Book a free class. The teacher will listen to your child read for a few minutes and tell you exactly where to start.",
      faqs: [
        { q: "What exactly is Tajweed?", a: "Tajweed is the set of rules governing correct Quranic pronunciation — how each letter is articulated, when sounds are elongated, merged or held. It matters because Arabic pronunciation changes meaning." },
        { q: "Is learning Tajweed compulsory?", a: "Reciting the Quran correctly is widely regarded as an obligation, and Tajweed is how that correctness is achieved. What is not disputed is that avoiding errors which change meaning is required." },
        { q: "How long does it take to learn Tajweed?", a: "Working through the rules commonly takes six to eighteen months, depending on starting fluency and class frequency. Applying them consistently without thinking takes longer." },
        { q: "Can I learn Tajweed as an adult beginner?", a: "Yes. Adults often grasp the rules faster than children because the explanations are structural. The harder part is unlearning pronunciation habits formed over years." },
        { q: "Do I need to finish Qaida first?", a: "You need to be able to read Arabic letters and joined words. You do not need to have completed a formal Qaida course." },
        { q: "Which Tajweed rules do you start with?", a: "Makharij — the articulation points — always. Most persistent recitation errors trace back to a letter being formed in the wrong place." },
