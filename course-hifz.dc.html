<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { course: {
      h1: "Online Hifz Programme — Memorisation That Holds",
      name: "Hifz Programme",
      who: "For students who read fluently with correct Tajweed and are ready to commit. Usually from age eight, and for adults at any age.",
      ages: "8+ and adults", level: "Fluent recitation with correct Tajweed", session: "30 minutes, one-to-one — most Hifz students take 4–5 a week",
      duration: "Three to five years for full memorisation, with consistent daily work", prerequisite: "Tajweed established. We will tell you honestly if it is not.",
      outcomes: null,
      specialIntroHeading: "Memorising is the easy half",
      specialIntro: [
        "Most Hifz programmes are good at getting new material into a student's memory. Far fewer are good at keeping it there.",
        "A student can memorise five Juz in a year and have lost two of them by the following Ramadan, because revision was treated as something to fit in rather than the core of the programme.",
        "We build revision — Muraja'ah — into every single session from the first week. New material never takes more than half the class. If old material is slipping, new material stops until it is secure.",
        "It feels slower. It is not.",
      ],
      structureHeading: "What the programme covers",
      structure: [
        { h: "Sabaq · New memorisation", b: "A set portion each session, matched to your child's capacity rather than a fixed target. Recited to the teacher until it is accurate, not merely remembered." },
        { h: "Sabaq Para · Recent revision", b: "The most recently memorised Juz, revised in every session. This is where memorisation is either consolidated or quietly lost." },
        { h: "Manzil · Long-term revision", b: "A rotating cycle through everything memorised to date, so no portion goes more than a set period without being recited aloud." },
        { h: "Tajweed maintenance", b: "Pronunciation is checked continuously. An error memorised is an error repeated for life, which is why we do not start Hifz before Tajweed is sound." },
      ],
      startingPointHeading: "Is this the right starting point?",
      spYes: [
        "Your child reads fluently from the Mushaf with correct Tajweed.",
        "Your child wants to do this. Hifz driven entirely by a parent rarely lasts past the first year.",
        "You can commit to four or five classes a week plus daily revision at home. Hifz is the one course where frequency genuinely matters.",
      ],
      spNoLabel: "Not yet, if:",
      spNo: [
        "Tajweed is not established. Memorising incorrect pronunciation is far harder to fix later than learning it properly now. Start with Tajweed Ul Quran.",
        "Your family cannot realistically commit to daily practice at the moment. There is no shame in this, and starting Hifz and stopping is worse than starting later.",
      ],
      extraNoteHeading: "A middle path",
      extraNoteBody: "Many families begin with selected Surahs — Juz Amma, Surah Yaseen, Surah Al-Mulk — rather than full Hifz. It is a genuine achievement in itself and it tests commitment before committing years. Ask us about it.",
      notSure: null,
      faqs: [
        { q: "How long does it take to memorise the Quran?", a: "With consistent daily classes and revision, full memorisation commonly takes three to five years. Be cautious of any programme quoting a fixed short timeframe — it usually means revision is being under-served." },
        { q: "How many classes a week does Hifz need?", a: "Four or five. Hifz is the one course where frequency genuinely determines outcome, because memorisation decays between sessions." },
        { q: "How do you handle revision?", a: "Revision is built into every session, not scheduled separately. Each class covers new memorisation, recent revision of the current Juz, and a rotating cycle through everything memorised to date." },
        { q: "Can my child do Hifz alongside school?", a: "Yes, and most of our Hifz students do. It requires a fixed daily slot rather than fitting it in when convenient. We schedule in your local timezone." },
        { q: "Do you offer Ijazah?", a: "We do not currently award Ijazah on completion of Hifz, though several of our teachers hold their own and can advise if you would like to pursue one separately." },
        { q: "What if my child falls behind?", a: "We pause new material and consolidate. Falling behind in Hifz is almost always a revision problem rather than a memory problem, and pushing forward makes it worse." },
      ],
      related: [
        { name: "Tajweed Ul Quran", slug: "tajweed", desc: "the prerequisite, and worth doing properly first." },
        { name: "Quran Recitation", slug: "quran-recitation", desc: "if fluency needs building." },
        { name: "Understand Quran", slug: "understand-quran", desc: "many Hifz students take this alongside, to know what they are memorising." },
      ],
      finalCtaHeading: "Start with a free Hifz class",
      finalCtaBody: "Thirty minutes, one-to-one, with the teacher of your choice. No card details and no obligation.",
      finalCtaSecondary: "Ask About This Course on WhatsApp",
    } };
  }
}
