class Component extends DCLogic {
  renderVals() {
    return { course: {
      h1: "Basic Qaida Course — Learn to Read Arabic Letters Correctly",
      name: "Basic Qaida Course",
      who: "For children from age four, and for adults starting from the very beginning. No prior knowledge needed — that is the point of this course.",
      ages: "4+ and adults", level: "Complete beginner", session: "30 minutes, one-to-one",
      duration: "4–12 months, depending on age and how often you attend", prerequisite: "None",
      outcomes: [
        "Recognise every Arabic letter, in isolation and in the four positions letters change shape in.",
        "Pronounce each letter from the correct point of articulation — including the ones English speakers routinely get wrong.",
        "Read the short vowels, Tanween, Sukoon and Shaddah accurately.",
        "Join letters into words and read short words without stopping to work each one out.",
        "Read short Quranic phrases and the shortest Surahs with correct pronunciation.",
      ],
      outcomesClosing: "That last point matters more than it sounds. A child who finishes Qaida properly can open a Mushaf and make sense of what is in front of them. A child who rushed it will spend the next three years reading around their mistakes.",
      structureHeading: "How the course is structured",
      structure: [
        { h: "Stage 1 · The letters", b: "All 28 letters, individually, with the correct articulation point for each. This stage is slower than parents expect and it is where the whole course is either built properly or not." },
        { h: "Stage 2 · Letter forms and joining", b: "How each letter changes shape at the beginning, middle and end of a word — and how to read a joined word as one unit rather than four separate letters." },
        { h: "Stage 3 · Vowels and marks", b: "Fatha, Kasra, Damma, then Tanween, Sukoon and Shaddah. Each one introduced only once the previous is secure." },
        { h: "Stage 4 · Reading words and phrases", b: "Putting it together — reading short words, then phrases, then the shortest Surahs, with the teacher correcting as your child goes." },
      ],
      startingPointHeading: "Is Qaida the right starting point for your child?",
      spYes: [
        "Your child does not yet recognise Arabic letters reliably, or recognises them individually but cannot read a joined word.",
        "Your child learned Qaida before but has forgotten most of it. Restarting is normal and far faster the second time.",
        "You are an adult who never learned, or learned as a child and cannot read now.",
      ],
      spNoLabel: "Probably not, if:",
      spNo: [
        "Your child can already read short Surahs from the Mushaf, even slowly. Start with Quran Recitation instead.",
        "Your child reads fluently but with pronunciation errors. That is Tajweed, not Qaida — go to Tajweed Ul Quran.",
        "You want to understand meaning rather than learn to read. Go to Understand Quran or Arabic for Beginners.",
      ],
      notSure: "Message us. We would rather place your child properly than sell you the wrong course and lose you in month two.",
      faqs: [
        { q: "What age can my child start Qaida?", a: "Most children are ready from around age four or five, once they can sit and focus for a short stretch. Younger children do better with shorter, more frequent sessions. If you are unsure, book a free class — the teacher will tell you honestly whether your child is ready." },
        { q: "How long does Qaida take to complete?", a: "Commonly four to twelve months. The range is wide because age, class frequency and practice between sessions all matter. A five-year-old attending twice a week progresses differently from a nine-year-old attending four times." },
        { q: "What comes after Qaida?", a: "Quran Recitation, where your child moves from reading words to reading continuously from the Mushaf. Tajweed usually follows once that fluency is established." },
        { q: "Which Qaida book do you use?", a: "Noorani Qaida, the standard primer. If your child has already started a different Qaida at their madrasah, we can continue with that one so they are not restarted unnecessarily." },
        { q: "My child learned Qaida before but forgot it. Where do we start?", a: "This is extremely common and not a setback. The teacher will assess what your child retains in the free class and start from there." },
        { q: "Can adults take this course?", a: "Yes, and many do. Adult beginners often progress faster through the early stages because they understand the structure being taught." },
      ],
