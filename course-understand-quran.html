    return { course: {

      who: "For teenagers and adults who can read the Quran but do not understand it — and who would rather not depend on a translation forever.",

      duration: "Five levels, roughly 3–4 months each", prerequisite: "Can read the Quran, with or without full fluency",
      outcomes: [
        "Recognise the Quranic vocabulary that accounts for the large majority of the text — learned in order of frequency, not chapter order.",
        "Follow the meaning of a familiar Surah while reciting it, without reading a translation alongside.",
        "Understand the grammatical patterns that recur constantly, so new verses become partly readable.",
        "Follow more of what is being recited in Taraweeh.",
      ],
      structureHeading: "How the course is structured",
      structure: [
        { h: "The principle", b: "We do not start at chapter one, word one. We start with the words that appear most often — because learning those first unlocks a disproportionate amount of the text early." },
        { h: "Levels 1–2 · Core vocabulary", b: "The most frequent words and particles, with the short Surahs as practice ground." },
        { h: "Level 3 · Sentence patterns", b: "How Quranic sentences are built — enough grammar to follow, without a full grammar course." },
        { h: "Levels 4–5 · Reading longer passages", b: "Working through longer Surahs, understanding as you go rather than translating afterwards." },
      ],
      startingPointHeading: "Is this the right starting point?",
      spYes: [
        "You can read but the meaning passes you by.",
        "You are memorising and want to know what you are memorising.",
        "You want to follow Taraweeh rather than wait for it to end.",
      ],
      spNoLabel: "Consider instead:",
      spNo: [
        "Arabic for Beginners — if you want the language broadly, not only the Quranic register.",
        "Basic Qaida — if reading itself is still difficult.",
      ],
      notSure: null,
      faqs: [
        { q: "Do I need to know Arabic first?", a: "No. This course teaches Quranic vocabulary and sentence patterns directly. It is not a general Arabic course." },
        { q: "What are the five levels?", a: "Levels 1 and 2 cover the most frequently occurring Quranic vocabulary. Level 3 covers sentence patterns and essential grammar. Levels 4 and 5 apply both to longer passages." },
        { q: "Is this Tafsir?", a: "No. Tafsir is scholarly exegesis — context, rulings and interpretation. This course teaches you to understand the words themselves, and makes Tafsir far more useful when you come to it." },
        { q: "Which translation do you use?", a: "We teach primarily from Saheeh International, chosen for clarity for English-speaking students, and we point out where other translations differ on a given verse." },
