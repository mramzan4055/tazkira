<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { course: {
      h1: "Islamic Studies for New Muslims — Nothing Assumed",
      name: "Islamic Studies for New Muslims",
      who: "For anyone who has recently become Muslim. You do not need to know the alphabet, the terminology, or how to pray. That is what this course is for.",
      ages: "New Muslims, at any age", level: "Complete beginner. No Arabic required.", session: "30 minutes, one-to-one",
      duration: "3–6 months for the foundations, then continue wherever you choose", prerequisite: "Female or male teacher, as you prefer — just tell us",
      outcomes: null,
      specialIntroHeading: "You are allowed to know nothing yet",
      specialIntro: [
        "Most Islamic education assumes you grew up with it. The terminology is unexplained, the alphabet is taken for granted, and the questions you actually have feel too basic to ask out loud.",
        "This course assumes none of it.",
        "You will not be asked what you already know in a way that makes you feel behind. You will not be handed a book in a script you cannot read. And you can ask the same question three times without anyone sighing.",
        "One teacher, one student, and no audience.",
      ],
      structureHeading: "What we cover, in this order",
      structure: [
        { h: "1. How to pray — properly, and soon", b: "The positions, the words, what they mean, and what to do when you forget something mid-prayer." },
        { h: "2. Purification", b: "Wudu and ghusl, step by step, including the practical questions people are often too embarrassed to ask." },
        { h: "3. The foundations of belief", b: "What Muslims believe and why — explained rather than asserted, with room for your questions." },
        { h: "4. The Arabic script", b: "Starting from the letters. By the end you will be reading short Surahs rather than reciting from transliteration." },
        { h: "5. The duas of daily life", b: "Before eating, before sleeping, when travelling — with meanings, so you know what you are saying." },
        { h: "6. Practical questions", b: "Family, workplace, Ramadan, community. The things nobody covers and everybody needs." },
      ],
      startingPointHeading: "Is this the right starting point?",
      spYes: [
        "You became Muslim recently and are not sure where to begin.",
        "You are praying from transliteration and want to read the actual script.",
        "You have questions you have not wanted to ask in front of other people.",
        "You are considering Islam and want to learn without pressure. That is welcome here — you will not be pushed.",
      ],
      spNoLabel: "Also consider:",
      spNo: [
        "Basic Qaida — if reading Arabic is your main priority right now.",
        "The 5 Pillars of Islam — if you want the foundations before anything else.",
        "Daily Duas & Supplications — short, immediately usable, and a good confidence builder alongside this course.",
      ],
      notSure: null,
      faqs: [
        { q: "I have just become Muslim. Where do I start?", a: "With prayer. It is the thing most new Muslims most want to get right and worry about most. This course begins there, then moves to purification, belief and reading the Arabic script." },
        { q: "Do you assume I know anything?", a: "No. Not the alphabet, not the terminology, not how to pray. Every Arabic or Islamic term is explained on first use." },
        { q: "Can I have a teacher of the same gender?", a: "Yes. Tell us at booking and we will arrange it. You do not need to give a reason." },
        { q: "Can I ask questions I feel embarrassed about?", a: "Yes, and you should. Every teacher on this course has taught new Muslims before. There is no audience — it is one teacher and you." },
        { q: "I am not Muslim but I want to learn. Can I join?", a: "Yes. You are welcome to learn without any commitment or expectation. Say so when you book and the teacher will approach it accordingly." },
        { q: "How long before I can pray without transliteration?", a: "It varies, but many students are reading the short Surahs in Arabic within a few months of consistent classes." },
      ],
      related: [
        { name: "Basic Qaida", slug: "basic-qaida", desc: "if reading Arabic is your main priority right now." },
        { name: "The 5 Pillars of Islam", slug: "five-pillars", desc: "if you want the foundations before anything else." },
        { name: "Daily Duas & Supplications", slug: "daily-duas", desc: "a good confidence builder alongside this course." },
      ],
      finalCtaHeading: "Start from the beginning",
      finalCtaBody: "A free 30-minute class, one-to-one, with a teacher of the gender you prefer. Nothing assumed and nothing expected.",
      finalCtaSecondary: "Ask a Question First on WhatsApp",
    } };
  }
}
